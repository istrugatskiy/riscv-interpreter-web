<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="64-bit RISC-V Interpreter with support for 84 instructions (RV64I + M extension + pseudoinstructions), syntax highlighting, autocomplete, and error handling. This interpreter is used by students at Cornell University for educational purposes."
        />
        <title>RISC-V Interpreter</title>
        <link rel="stylesheet" type="text/css" href="index.css" />
        <script type="module" src="./index.ts"></script>
    </head>

    <body class="bg-dark-material overflow-auto text-gray-300 h-screen flex flex-col font-sans">
        <!-- Header -->
        <header class="bg-material w-full p-4 sticky top-0 z-1">
            <div class="flex justify-center space-x-4">
                <button
                    class="bg-gray-600 hover:bg-gray-500 text-white py-2 px-4 rounded"
                    id="reset"
                    disabled
                >
                    reset
                </button>

                <button
                    class="bg-gray-600 hover:bg-gray-500 text-white py-2 px-4 rounded"
                    id="stop"
                    disabled
                >
                    stop
                </button>
                <button
                    class="bg-gray-600 hover:bg-gray-500 text-white py-2 px-4 rounded"
                    id="step"
                >
                    step
                </button>
                <button
                    class="bg-gray-600 hover:bg-gray-500 text-white py-2 px-4 rounded"
                    id="run"
                >
                    run
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex flex-1 flex-col md:flex-row space-x-0 md:space-x-4 space-y-4 md:space-y-0 p-4">
            <section class="flex flex-col w-full h-full md:w-1/2 gap-4">
                <subsection 
                    class="w-full h-2/3 p-6 rounded-lg bg-material"
                    id="editor"
                ></subsection>
                <subsection
                    class="w-full h-full md:h-1/3 bg-material p-6 rounded-lg overflow-auto"
                >
                    <h1 class="text-xl">Log Output</h1>
                    <div id="logs" class="max-h-[max(20vh,125px)] font-mono"></div>
                </subsection>
            </section>
            <section class="flex flex-col w-full h-full md:w-1/2 gap-4">
                <subsection
                    class="h-2/3 w-full bg-material p-6 rounded-lg overflow-auto flex flex-col items-center font-mono"
                    id="register-tab"
                >
                    <div>
                        <label for="view_as">View as:</label>
                        <select
                            id="view_as"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        >
                            <option value="hex" selected>hex</option>
                            <option value="binary">binary</option>
                            <option value="decimal">decimal</option>
                        </select>
                    </div>
                    <div
                        class="w-full" 
                        id="registers"
                    ></div>
                </subsection>
                <subsection
                    class="h-1/3 bg-material p-6 rounded-lg flex flex-col items-center font-mono"
                >
                    <h1 class="text-xl text-left w-full">Memory View</h1>
                    <div>
                        <label for="offset">Memory Offset:</label>
                        <input
                            id="offset"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                            type="number"
                            value="0"
                        />
                    </div>
                    <div id="mem-values"></div>
                </subsection>
            </section>
        </main>
    </body>
</html>
