name: Build and Deploy RISC-V Interpreter Web
# attempt 2 gpt4o is stupid
on:
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  lfs: true

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '18'

            - name: Install dependencies
              run: .yarn/releases/yarn-4.9.2.cjs install

            - name: Build with Parcel
              run: .yarn/releases/yarn-4.9.2.cjs parcel build src/index.html --public-url ./ --no-scope-hoist # "temporary fix"

            - name: Upload artifact for GitHub Pages
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
